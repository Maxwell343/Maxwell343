<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Maxwell Mathew — Terminal Architect</title>
<desc id="desc">An animated terminal-inspired engineering banner in black, phosphor green, and signal amber.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#234332" stroke-width=".7" opacity=".52"/></pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72FFA7" stop-opacity=".12"/><stop offset="1" stop-color="#FFB454" stop-opacity=".02"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="screen"><rect x="24" y="24" width="1152" height="342" rx="15"/></clipPath>
</defs>
<rect width="1200" height="390" rx="18" fill="#050907"/>
<g clip-path="url(#screen)">
  <rect x="24" y="24" width="1152" height="342" rx="15" fill="#0A120D" stroke="#234332"/>
  <rect x="24" y="24" width="1152" height="342" fill="url(#grid)"/>
  <rect x="24" y="24" width="1152" height="342" fill="url(#fade)"/>
  <path d="M850 24L1176 24L1176 366L1060 366Z" fill="#72FFA7" opacity=".025"/>
  <g fill="#91A99A" font-family="monospace" font-size="12" letter-spacing="2">
    <text x="52" y="56">MAXWELL343 / ENGINEERING TERMINAL</text>
    <text x="1000" y="56">SESSION: 001</text>
  </g>
  <circle cx="1122" cy="51" r="4" fill="#72FFA7"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <path d="M52 78H1148" stroke="#234332"/>
  <rect x="52" y="105" width="4" height="186" rx="2" fill="#72FFA7" filter="url(#glow)"/>
  <g font-family="monospace">
    <text x="78" y="116" fill="#72FFA7" font-size="13" letter-spacing="4">SYSTEM PROFILE // ENGINEERING LOG</text>
    <text x="76" y="177" fill="#E8F5EC" font-size="47" font-weight="700" letter-spacing="-1.8">I BUILD THINGS</text>
    <text x="76" y="229" fill="#E8F5EC" font-size="47" font-weight="700" letter-spacing="-1.8">THAT WORK.</text>
    <text x="79" y="264" fill="#FFB454" font-size="15" letter-spacing="1.2">AI ENGINEERING  /  ML SYSTEMS  /  SOFTWARE</text>
    <text x="79" y="313" fill="#91A99A" font-size="13">idea <tspan fill="#FFB454">→</tspan> system <tspan fill="#FFB454">→</tspan> evaluation <tspan fill="#FFB454">→</tspan> iteration</text>
  </g>
  <g transform="translate(914 118)">
    <rect width="184" height="184" rx="22" fill="#07100A" stroke="#234332" stroke-width="1.5"/>
    <rect x="10" y="10" width="164" height="164" rx="16" fill="none" stroke="#72FFA7" stroke-opacity=".28"/>
    <path d="M28 36H54M28 46H44" stroke="#FFB454" stroke-width="2" stroke-linecap="round"/>
    <text x="92" y="112" text-anchor="middle" font-family="monospace" font-size="64" font-weight="700" fill="#72FFA7" filter="url(#glow)">M.</text>
    <circle cx="151" cy="31" r="4" fill="#FFB454"><animate attributeName="r" values="4;2.5;4" dur="1.4s" repeatCount="indefinite"/></circle>
    <path d="M28 143H156" stroke="#234332"/>
    <text x="92" y="161" text-anchor="middle" font-family="monospace" font-size="9" letter-spacing="2" fill="#91A99A">BUILD / TEST / SHIP</text>
  </g>
  <rect x="78" y="339" width="7" height="12" fill="#72FFA7"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  <text x="94" y="349" font-family="monospace" font-size="11" fill="#91A99A">READY FOR NEXT PROBLEM</text>
  <text x="1098" y="349" text-anchor="end" font-family="monospace" font-size="11" fill="#FFB454">BUILD WITH INTENT_</text>
</g>
</svg>