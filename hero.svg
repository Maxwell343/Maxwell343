<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">MAXWELL MATHEW — Redline Engineering Terminal</title><desc id="desc">A high-contrast black and crimson engineering banner with angular M insignia, technical grid, and animated scan lines.</desc>
<defs>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#292930" stroke-width=".7"/></pattern>
 <pattern id="diag" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="3" height="10" fill="#FF243B" opacity=".24"/></pattern>
 <linearGradient id="redwash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF243B" stop-opacity=".2"/><stop offset=".6" stop-color="#B20D24" stop-opacity=".04"/><stop offset="1" stop-color="#050506" stop-opacity="0"/></linearGradient>
 <linearGradient id="emblem" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF5263"/><stop offset=".5" stop-color="#FF243B"/><stop offset="1" stop-color="#B20D24"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="frame"><rect x="14" y="14" width="1172" height="372" rx="6"/></clipPath>
</defs>
<rect width="1200" height="400" rx="8" fill="#050506"/>
<g clip-path="url(#frame)">
 <rect x="14" y="14" width="1172" height="372" fill="#050506" stroke="#34343B"/>
 <rect x="14" y="14" width="1172" height="372" fill="url(#grid)" opacity=".8"/>
 <rect x="14" y="14" width="1172" height="372" fill="url(#redwash)"/>
 <path d="M14 15H470L395 95H14Z" fill="#FF243B" opacity=".09"/>
 <path d="M14 15H470L395 95H14Z" fill="url(#diag)" opacity=".55"/>
 <path d="M14 342L90 342L132 386H14Z" fill="#FF243B" opacity=".12"/>
 <path d="M788 14H1186V386H1103L788 14Z" fill="#111116" opacity=".72"/>
 <path d="M24 74H1176" stroke="#B20D24" stroke-width="1" opacity=".75"/>
 <path d="M24 336H1176" stroke="#34343B" stroke-width="1"/>
 <path d="M24 74H110" stroke="#FF243B" stroke-width="3" filter="url(#glow)"/>
 <g font-family="monospace" font-size="11" letter-spacing="2.3" fill="#9A9BA4">
  <text x="38" y="48">MAXWELL343</text><text x="165" y="48" fill="#FF243B">//</text><text x="197" y="48">ENGINEERING TERMINAL</text>
  <text x="894" y="48">BUILD</text><text x="944" y="48" fill="#FF243B">&gt;</text><text x="966" y="48">TEST</text><text x="1008" y="48" fill="#FF243B">&gt;</text><text x="1030" y="48">SHIP</text>
 </g>
 <g stroke="#FF243B" stroke-width="1.4" opacity=".85"><path d="M30 28H48M39 19V37"/><path d="M1152 28H1170M1161 19V37"/><path d="M30 366H48M39 357V375"/><path d="M1152 366H1170M1161 357V375"/></g>
 <g font-family="monospace" font-size="10" fill="#9A9BA4" letter-spacing="1.8">
  <text x="35" y="125" fill="#FF243B">01</text><text x="35" y="169">02</text><text x="35" y="213">03</text><text x="35" y="257">04</text><text x="35" y="301">05</text>
 </g><path d="M70 111V311" stroke="#34343B" stroke-width="2"/><path d="M70 111V146" stroke="#FF243B" stroke-width="3" filter="url(#glow)"/>
 <path d="M109 111V303" stroke="#FF243B" stroke-width="2" opacity=".8"/>
 <g font-family="Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-2">
  <text x="132" y="174" font-size="67" fill="#F5F5F7">MAXWELL</text>
  <text x="132" y="238" font-size="67" fill="#FF243B">MATHEW</text>
  <text x="134" y="282" font-size="27" letter-spacing="1.5" fill="#F5F5F7">I BUILD SYSTEMS THAT SHIP<tspan fill="#FF243B">.</tspan></text>
 </g>
 <g font-family="monospace" font-size="13" letter-spacing="2" fill="#9A9BA4"><text x="135" y="315">AI ENGINEERING</text><text x="295" y="315" fill="#FF243B">//</text><text x="320" y="315">ML SYSTEMS</text><text x="449" y="315" fill="#FF243B">//</text><text x="475" y="315">SOFTWARE</text></g>
 <path d="M134 336H705" stroke="#34343B"/><path d="M134 336H258" stroke="#FF243B" stroke-width="2"/>
 <g font-family="monospace" font-size="10" letter-spacing="1.3"><text x="135" y="359" fill="#9A9BA4">PROBLEM → DESIGN → BUILD → EVALUATE → ITERATE</text><text x="701" y="359" fill="#FF243B" text-anchor="end">SYSTEM STATUS: ACTIVE_</text></g>
 <!-- technical emblem zone -->
 <g transform="translate(818 88)">
  <path d="M0 28H62M0 28V240M0 240H62M286 28H224M286 28V240M286 240H224" fill="none" stroke="#FF243B" stroke-width="1.4" opacity=".75"/>
  <path d="M17 43L34 26H252L269 43V225L252 242H34L17 225Z" fill="#070709" stroke="#B20D24" stroke-width="1.8"/>
  <path d="M28 52L42 38H244L258 52V216L244 230H42L28 216Z" fill="none" stroke="#34343B"/>
  <path d="M52 196V75L143 170L234 75V196" fill="none" stroke="url(#emblem)" stroke-width="21" stroke-linejoin="miter" filter="url(#glow)"/>
  <path d="M52 196V75L143 170L234 75V196" fill="none" stroke="#F5F5F7" stroke-opacity=".72" stroke-width="1.3"/>
  <path d="M143 29V51M143 217V241M6 135H28M258 135H280" stroke="#FF243B" stroke-width="1.4"/>
  <circle cx="143" cy="135" r="100" fill="none" stroke="#FF243B" stroke-dasharray="2 8" opacity=".6"><animateTransform attributeName="transform" type="rotate" from="0 143 135" to="360 143 135" dur="45s" repeatCount="indefinite"/></circle>
  <circle cx="143" cy="135" r="112" fill="none" stroke="#34343B" stroke-dasharray="44 12 4 12" opacity=".8"/>
  <circle cx="252" cy="42" r="4" fill="#FF243B" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.3s" repeatCount="indefinite"/></circle>
  <text x="143" y="267" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="2.5" fill="#9A9BA4">M / 343 / SYSTEMS</text>
 </g>
 <!-- moving scan bar -->
 <rect x="114" y="102" width="990" height="1.5" fill="#FF243B" opacity=".65"><animate attributeName="y" values="95;323;95" dur="7s" repeatCount="indefinite"/></rect>
 <path d="M748 15V385" stroke="#FF243B" stroke-opacity=".22" stroke-dasharray="4 8"/>
 <g fill="#FF243B"><rect x="1132" y="94" width="5" height="5"/><rect x="1132" y="105" width="5" height="5"/><rect x="1132" y="116" width="5" height="5"/><rect x="1143" y="94" width="5" height="5"/><rect x="1143" y="105" width="5" height="5"/><rect x="1143" y="116" width="5" height="5"/></g>
 <rect x="1173" y="14" width="4" height="372" fill="#FF243B" opacity=".8"/>
</g></svg>