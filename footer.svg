<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100" viewBox="0 0 1000 100" role="img" aria-labelledby="t d"><title id="t">End of engineering log</title><desc id="d">A terminal-inspired footer inviting collaboration.</desc><rect width="1000" height="100" rx="12" fill="#050907" stroke="#234332"/><text x="28" y="39" font-family="monospace" font-size="12" letter-spacing="2" fill="#72FFA7">END OF LOG / NEXT BUILD LOADING</text><text x="28" y="67" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#E8F5EC">Curious about a problem? Let's build something useful.</text><text x="972" y="57" text-anchor="end" font-family="monospace" font-size="13" fill="#FFB454">M. <tspan><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>_</tspan></text></svg>