<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="115" viewBox="0 0 1100 115" role="img" aria-labelledby="t d"><title id="t">Close engineering log</title><desc id="d">A black and red footer closing with a build philosophy.</desc><rect width="1100" height="115" rx="5" fill="#050506" stroke="#34343B"/><path d="M0 0H300L284 12H0Z" fill="#FF243B"/><path d="M26 28V87" stroke="#FF243B" stroke-width="3"/><text x="46" y="42" font-family="monospace" font-size="10" letter-spacing="2.6" fill="#FF243B">END OF LOG / NEXT BUILD LOADING</text><text x="46" y="72" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#F5F5F7">Curious about a problem? Let's build something useful.</text><path d="M850 22H1070V91H850Z" fill="#08080B" stroke="#B20D24"/><text x="960" y="49" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="2" fill="#9A9BA4">STATUS</text><text x="960" y="73" text-anchor="middle" font-family="monospace" font-size="17" font-weight="700" fill="#FF243B">BUILDING<tspan><animate attributeName="opacity" values="1;.15;1" dur="1.4s" repeatCount="indefinite"/>_</tspan></text></svg>