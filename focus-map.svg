    <text x="144" y="28" fill="#FF243B">//</text>
    <text x="171" y="28" fill="#8F9299">IDENTITY PROTOCOL</text>
    <text x="1166" y="28" text-anchor="end" fill="#8F9299">PROFILE MODULE / 001</text>
  </g>
  <g stroke="#FF243B" fill="none" stroke-width="1.2" opacity=".95">
    <path d="M31 64V91H58"/><path d="M1169 64V91H1142"/>
