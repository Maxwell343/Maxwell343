  <path d="M8 8H420L300 125H8Z" fill="url(#redwash)"/>
  <path d="M1192 292H935L1090 137H1192Z" fill="#FF243B" opacity=".05"/>
  <path d="M24 38H1176" stroke="#29272C"/>
