  </g>
  <path d="M68 136H1132" stroke="#30242A"/>
  <text x="570" y="177" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" letter-spacing=".5" fill="#F3F3F4">LESS WONDERING.</text><text x="590" y="177" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" letter-spacing=".5" fill="#FF243B">MORE PROTOTYPING.</text>
  <text x="600" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" letter-spacing="1.3" fill="#B8B8BE">BUILDING WHAT I WISH EXISTED<span fill="#FF243B">.</span></text>
