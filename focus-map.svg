<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Maxwell Mathew — Redline identity strip</title>
<desc id="desc">A cinematic black and crimson engineering identity strip showing AI engineering, applied machine learning, backend systems, full-stack engineering, and the motto: Less wondering, more prototyping. Building what I wish existed.</desc>
<defs>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#25282D" stroke-width=".7"/></pattern>
  <linearGradient id="redwash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF243B" stop-opacity=".20"/><stop offset="1" stop-color="#FF243B" stop-opacity="0"/></linearGradient>
  <linearGradient id="linefade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF243B" stop-opacity="0"/><stop offset=".25" stop-color="#FF243B"/><stop offset=".75" stop-color="#FF243B"/><stop offset="1" stop-color="#FF243B" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect x="8" y="8" width="1184" height="284" rx="10"/></clipPath>
</defs>
<rect width="1200" height="300" rx="12" fill="#050608"/>
